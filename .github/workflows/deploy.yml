# 사이트 빌드 → 배포 전 검사 → GitHub Pages 배포 → 검색엔진 변경 알림(IndexNow)
#
# main 브랜치에 push 하면 자동으로 실행됩니다. (Actions 탭 → Run workflow 로 수동 실행도 가능)
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
# 바꾸기 전에는 빌드·검사만 하고, 무엇을 눌러야 하는지 실행 요약에 안내합니다.
name: 사이트 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 빌드·검사
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # Pages 설정(배포 주소·방식)을 읽기 위해
    outputs:
      deployable: ${{ steps.pages.outputs.deployable }}
      site_url: ${{ steps.pages.outputs.site_url }}
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sitemap의 lastmod(페이지별 마지막 수정 시각)를 커밋 이력으로 계산

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # 외부 패키지를 쓰지 않음

      - name: 빌드 도구 테스트
        run: npm test

      - name: GitHub Pages 설정 확인
        id: pages
        run: node scripts/ci/pages-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: 빌드
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}

      - name: 배포 전 검사
        run: npm run check

      - name: 검색엔진에 알릴 페이지 계산 (IndexNow)
        id: indexnow
        if: steps.pages.outputs.deployable == 'true'
        run: node scripts/indexnow.mjs plan

      - name: 배포 파일 올리기
        if: steps.pages.outputs.deployable == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages 배포
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: 검색엔진 변경 알림 (IndexNow)
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 네이버·Bing에 바뀐 페이지 알리기
        run: node scripts/indexnow.mjs submit
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
